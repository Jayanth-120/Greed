services:
  - type: web
    name: greed-shaping-world
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: greed-world-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DB_PATH
        value: /opt/render/project/src/data/world.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
